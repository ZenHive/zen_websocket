[[task]]
id = "2"
phase = 1
bundle = "reconnect"
status = "done"
title = "Fix the reconnect state machine and its supervisor-side fallout"
scores = { d = 5, b = 10, u = 9 }
markers = ["bug"]
acceptance_criteria = ["A regression test drives the TCP-connects-but-101-never-arrives case and is demonstrated to FAIL against current main before the state machine is touched", "Under that test the client stops after config.retry_count attempts instead of retrying forever, and successive attempts are separated by the configured backoff", "Each connection attempt's timeout timer carries an attempt identity and is cancelled when that attempt resolves; a stale timer from attempt N cannot terminate attempt N+1, asserted against the timeline in the body — the third connection attempt must land at the later, own-deadline time and not at the stale timer's deadline", "A single socket close produces exactly one reconnect attempt, not two — asserted by counting accepts, which currently shows two in the same millisecond", "connect/2 against an unresolvable host returns the underlying reason (e.g. :nxdomain) without blocking for the full configured timeout", "Client.connect/2 and the ClientSupervisor connect path return {:error, reason} instead of exiting the caller when the client terminates with :max_reconnection_attempts, asserted by a test that checks the caller survives", "ClientSupervisor.list_clients/0 and send_balanced/2 tolerate a child reported as :restarting without raising ArgumentError", "mix precommit.full green"]
out_of_scope = ["Decomposing client.ex into smaller modules — that is a separate refactor and must not ride along", "Changing the public Client API surface", "Reworking heartbeat or subscription restore beyond what the timer fix requires"]
files_to_modify = ["lib/zen_websocket/client.ex", "lib/zen_websocket/client_supervisor.ex", "lib/zen_websocket/reconnection.ex", "test/zen_websocket/client_reconnect_test.exs"]
assignee = "cursor"
model = "cursor-grok-4.6-xhigh"
body = """
Four defects on the same connect/reconnect clauses. Fix them as one change — splitting them means four agents rewriting the same function bodies.

1. UNBOUNDED, BACKOFF-FREE RECONNECT when TCP connects but the WebSocket upgrade never completes. `retry_count` is incremented ONLY in the `{:error, _}` branch of `handle_continue(:reconnect)` (client.ex:665), and `Reconnection.max_retries_exceeded?/2` is consulted ONLY in `handle_info(:retry_reconnect)` (client.ex:892), which is reachable only from that same branch. When `establish_connection/1` returns `{:ok, _}` but the 101 never arrives, the SUCCESS branch runs, the `{:connection_timeout, _}` timer fires, `handle_connection_error/2` routes back to `{:continue, :reconnect}`, and it succeeds again. `retry_count` stays 0 forever and backoff is never applied — the client hammers the endpoint at 1/timeout Hz indefinitely, and `retry_count: 3` does not stop it. This is the Cloudflare-5xx-in-front-of-an-exchange shape the repo already keeps a test file for (test/zen_websocket/cloudflare_alpn_integration_test.exs).

2. CONNECTION TIMERS ARE NEVER CANCELLED AND CARRY NO ATTEMPT IDENTITY. Scheduled at client.ex:610 and :649 as `{:connection_timeout, config.timeout}` — the payload is a duration, not an attempt ref — and the only `Process.cancel_timer` in the module is for the heartbeat. A stale timer from attempt N therefore still matches the `%{state: :connecting}` clause at :869 and tears down attempt N+1 mid-connect. Under defect 1 these accumulate without bound.

3. `handle_continue({:connection_failed, reason})` at client.ex:620 is a bare `{:noreply, state}`. The reason is discarded, the waiting caller is never replied to, and no retry is scheduled, so `connect("wss://bad-host.invalid", timeout: 30_000)` blocks the full 30s and reports a generic reason instead of `:nxdomain`.

4. ABNORMAL TERMINATION KILLS CALLERS. The await_connection wrappers catch only `:exit, {:timeout, _}` (client.ex:271, client_supervisor.ex:136), so a `:max_reconnection_attempts` stop during the call propagates and kills the CALLER instead of returning `{:error, _}` — violating both @specs. Same root cause on the supervisor side: `list_clients/0` pipes `DynamicSupervisor.which_children/1` through `Process.alive?/1` (client_supervisor.ex:195), which raises ArgumentError on the `:restarting` atom a restarting child carries in place of a pid. Because Client stops abnormally, `send_balanced/2` crashes its caller exactly when it should be routing around the dead connection.

Write the defect-1 regression test FIRST and confirm it fails before changing the state machine. All four line references were read directly from the source on 2026-08-20.

RUNTIME-VERIFIED 2026-08-20 (Tidewave project_eval against the running dev BEAM — not static reading). Defects 1 and 3 reproduce; here is the harness and the observed output, so you can reuse it as the regression test.

Defect 1 repro: a raw `:gen_tcp` listener that completes the WebSocket handshake on the FIRST accept (101 + Sec-WebSocket-Accept), closes that socket after 1s, and on every subsequent accept takes the TCP connection and never speaks HTTP. Connect with `timeout: 500, retry_count: 3, retry_delay: 200, reconnect_on_error: true`, then count accepts. Observed: connect returns `:ok`; over the next 12 seconds the acceptor logged 23 further connections at 1, 1003, 1003, 1506, 2008, 2510, 3014, 3516, 4020, 4521, 5022, 5523, 6024, 6526, 7026, 7527, 8029, 8530, 9032, 9534, 10036, 10538, 11040, 11542 ms. That is a flat ~502 ms cadence — exactly `timeout`, with `retry_delay: 200` never applied and no growth whatsoever — and the client was still alive at the end. `retry_count: 3` demonstrably does not stop it. The duplicate 1003 ms timestamp is defect 2 showing itself: two overlapping attempts in the same millisecond.

Defect 3 repro: `Client.connect("wss://no-such-host.invalid/ws", timeout: 8_000, retry_count: 0)` returned `{:error, :connection_failed}` after 8071 ms. DNS resolution of a .invalid name fails in single-digit milliseconds, so the full 8s is the caller sitting unreplied-to; and the reason that does eventually surface is the generic `:connection_failed`, not the underlying `:nxdomain`. Assert both properties (elapsed well under `timeout`, and the specific reason) — the acceptance criterion says `:nxdomain`, and that is the intent even though today's placeholder is `:connection_failed`.

Defect 4, supervisor half: `Process.alive?(:restarting)` and `Process.alive?(:undefined)` both raise `ArgumentError` ("1st argument: not a pid"). Those are precisely the two non-pid values `DynamicSupervisor.which_children/1` reports, so the `Process.alive?/1` pipe in `list_clients/0` is a live crash path, not a theoretical one.

Defect 4, caller-killing half — RUNTIME-VERIFIED 2026-08-20. A stand-in GenServer whose `handle_call(:await_connection, _, s)` returns `{:stop, :max_reconnection_attempts, s}`, called through exactly the `try/catch` shape at client.ex:262, produces the exit term `{:max_reconnection_attempts, {GenServer, :call, [pid, :await_connection, 5000]}}`. That does not match `:exit, {:timeout, _}`, so it escapes the catch entirely — the first attempt at this repro killed the evaluating process outright, and only an unlinked observer could capture the term. Both @specs promise `{:error, reason}`; today the caller dies instead. Match on the full `:exit, reason` and translate, rather than adding a second narrow clause.

Defect 2 — RUNTIME-VERIFIED 2026-08-20, and the arithmetic pins it exactly. Harness: same raw listener as defect 1, but attempt 1 upgrades successfully at t=0 and its socket is closed at t=3000; every later accept takes the TCP connection and stays silent. Connect with `timeout: 4_000, retry_count: 99, retry_delay: 50, reconnect_on_error: true`. Attempt 1 therefore leaves a timer pending until t=4000, while the reconnect that starts at t~3000 arms its own for t~7000. Observed accept timeline, in ms: 1, 3003, 3003, 4002, 7005, 8003.

Read it left to right. t=1 is attempt 1, which arms timer A for t=4001. t=3003 TWICE is the single socket close producing two simultaneous reconnect attempts in the same millisecond — a defect in its own right, and the same doubling seen in the defect-1 timeline; those arm timers B and C for t~7003. t=4002 is timer A — armed by an attempt that succeeded and then died three seconds earlier — firing on its original deadline, matching the `%{state: :connecting}` clause at client.ex:869, and tearing down an in-flight attempt whose own deadline was still 3 seconds away. t=7005 is B and C doing the same to attempt 4, and t=8003 is attempt 4's own timer (4002 + 4000) arriving last. Every fired timer kills whatever attempt happens to be `:connecting`, regardless of which attempt armed it. Assert on this timeline: with attempt-scoped, cancelled timers, the third accept must land at ~7000, not ~4000.

CONTEXT ON THE CLAUSE YOU ARE REWRITING: `mix reach.map --depth` (reach 2.8.2, measured 2026-08-20) puts `Client.handle_continue/2` at client.ex:625 at dominator depth 25 — the second-deepest function in the codebase, behind only `Reconnection.establish_connection/1` at 39. That is the same clause defects 1-3 live in. Do not treat "reduce the depth" as a goal of this task — correctness first, and decomposing client.ex is explicitly out of scope — but if the fix leaves that clause deeper than you found it, say so in the delivery notes so the follow-up refactor (R051/R052) is scoped against a real number rather than the April one.
"""
implemented = "Landed by cursor via merge-train; reviewer-approved (run run-1787292955301-e96c4920, 9a41ce7e1d77136984f33252c9b9622e442c21fc)."
