acceptance_criteria = ["authenticate/1 returns {:error, reason} when Deribit replies with a JSON-RPC error body, asserted by a test that feeds a realistic error response — {:ok, adapter} must not match a failed authentication", "The subscription-restore guard uses MapSet.size/1, and a test covers the empty-subscriptions case that the current map_size/1 guard admits", "Subscriptions survive a failed restore: a test asserts that when re-subscribe fails, the tracked set is not silently emptied and get_state does not report success", "SubscriptionManager.handle_message/2 only registers a channel on an actual subscription confirmation, not on every data frame carrying params.channel — covered by a test that feeds a data frame for an unsubscribed channel and asserts it is not added, and by a test that routes a realistic Deribit confirmation (an id/result frame) and asserts the channel IS tracked", "Either remove/2 has a caller in lib/ or it is removed; an unsubscribed channel is not restored on the next reconnect, asserted by a test", "RecorderServer buffered entries survive an abnormal exit of the client that started it, asserted by a test", "mix precommit.full green"]
out_of_scope = ["Merging the two Deribit adapters — they demonstrate standalone vs GenServer-wrapped patterns on purpose", "The reconnect state machine, its timers, and the supervisor-side await/catch clauses — task 2 owns those and lands first", "Any change to client.ex beyond the minimal message-routing clause needed so subscription confirmations reach SubscriptionManager"]
files_to_modify = ["lib/zen_websocket/examples/deribit_adapter.ex", "lib/zen_websocket/examples/deribit_genserver_adapter.ex", "lib/zen_websocket/subscription_manager.ex", "lib/zen_websocket/recorder_server.ex", "lib/zen_websocket/client.ex"]
assignee = "grok"
model = "grok-4.6"
body = """
Four independent defects in modules the gate cannot see into. All line references read from source on 2026-08-20.

1. FAILED AUTH MATCHES THE SUCCESS PATTERN. `DeribitAdapter.authenticate/1` uses a `with` chain with NO `else` clause. `JsonRpcTransport.send_json_rpc/2` returns `{:ok, response}` for a transport-level success even when the body is a JSON-RPC error, so on bad credentials the `with` falls through and returns that `{:ok, %{"error" => ...}}` verbatim. Callers writing the idiomatic `{:ok, adapter} = authenticate(adapter)` therefore MATCH on failed credentials and proceed to the trading path unauthenticated.

2. ALWAYS-TRUE GUARD. `deribit_genserver_adapter.ex:215` guards `handle_info(:restore_subs, %{subscriptions: subs} = state) when map_size(subs) > 0`, but `subscriptions` is a MapSet — a 2-key struct — so `map_size/1` is always 2 and the guard never excludes anything. Its own siblings at :176, :201 and :204 correctly use `MapSet.size/1`. Separately, the restore path clears the tracked subscriptions before re-subscribing and discards the reply, so a failed restore loses them permanently while `get_state` still reports an empty-but-healthy set.

3. UNSUBSCRIBES ARE UNDONE ON RECONNECT. `SubscriptionManager.handle_message/2` matches the bare shape `%{"params" => %{"channel" => channel}}` and calls `add/2`. There is no `"method" => "subscription"` constraint, so EVERY data frame carrying a channel re-adds that channel to the tracked set. Combined with `remove/2` having zero callers anywhere in lib/, an unsubscribe is undone by the next inbound tick and the channel is re-subscribed on the following reconnect.

4. RECORDER LOSES THE INTERESTING SLICE. RecorderServer sets no `trap_exit` and is started via `start_link` from Client, so a client crash kills it instantly and discards up to 99 buffered entries — precisely the window the recording exists to capture.

RUNTIME-VERIFIED 2026-08-20 (Tidewave project_eval against the running dev BEAM). All four defects confirmed directly.

Defect 2: `map_size(MapSet.new())` evaluates to `2` while `MapSet.size(MapSet.new())` is `0`. The guard at :215 admits the empty set, exactly as described.

Defect 1: evaluating the real `with` shape — first clause succeeds, second clause is fed a realistic `{:ok, %{"error" => %{"code" => 13009, "message" => "unauthorized"}, "id" => 1}}` — the chain returns that error tuple verbatim, and `match?({:ok, _adapter}, result)` is `true`. So the caller idiom `{:ok, adapter} = authenticate(adapter)` binds `adapter` to a raw Deribit error map and proceeds as if authenticated. Use exactly that response body in the regression test.

Defect 3 — confirmed, but the MECHANISM IN THE PARAGRAPH ABOVE IS WRONG; fix the right thing. The claim was that `handle_message/2` has no `"method" => "subscription"` constraint. It does not need one: client.ex:1061 already gates the call on exactly that. The real problem is that the gate selects the WRONG frames. Routing a realistic Deribit subscription CONFIRMATION `%{"jsonrpc" => "2.0", "id" => 2, "result" => ["book.BTC-PERPETUAL.raw"]}` through the clause order at client.ex:1050-1073 lands it in `handle_rpc_response` — it carries an `"id"` and no `"method"` — while a DATA tick `%{"method" => "subscription", "params" => %{"channel" => ..., "data" => ...}}` is what reaches `SubscriptionManager.handle_message/2`. So the function whose @doc says "Called when a subscription confirmation is received" never sees a confirmation at all; it sees only the data stream, and re-adds the channel on every tick.

The consequence, measured on the real functions: starting from a state tracking `book.BTC-PERPETUAL.raw`, `SubscriptionManager.remove/2` empties the set to `[]` — and then a SINGLE data tick for that channel puts it straight back to `["book.BTC-PERPETUAL.raw"]`. A tick for `ticker.ETH-PERPETUAL.100ms`, a channel never subscribed to, adds it too. Confirmed separately by grep: `SubscriptionManager.remove` has zero call sites anywhere in lib/, and the only two `SubscriptionManager.` call sites in lib/ are `build_restore_message` (client.ex:1034) and `handle_message` (client.ex:1063). The tracked set is therefore "every channel that has ever ticked", never shrinks, and is what gets replayed on reconnect.

Defect 4 — RUNTIME-VERIFIED, total loss. Harness: an owner process `start_link`s a RecorderServer, records 99 frames (`@flush_threshold` is 100, so nothing flushes), then exits with `:max_reconnection_attempts`. Before the crash, `:sys.get_state(rec).buffer_length` is 99 and `RecorderServer.stats/1` reports `%{bytes: 0, entries: 0}`. After the crash the recorder is DOWN with the same reason and the file on disk has 0 lines — all 99 frames lost. `terminate/2` exists in the module but never runs, because `trap_exit` is false and the linked abnormal exit kills the process outright. Note when writing the regression test: calling `flush/1` before the crash makes the test pass vacuously (99 lines land on disk) — the test must record below the threshold and NOT flush.

Adjacent finding while verifying, worth folding into defect 4's fix rather than filing separately: `HeartbeatManager.handle_generic_heartbeat/2` only ever does `MapSet.put` on `active_heartbeats` and never removes, so that set grows monotonically for the process lifetime.
"""
implemented = "Landed by grok via merge-train; reviewer-approved (run run-1787298069810-3305cc3a, a90639dc2531327d7284b33239864aa9e99b8b2a)."
