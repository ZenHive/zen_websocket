[[task]]
id = "3"
phase = 1
bundle = "correctness"
status = "done"
title = "Fix RateLimiter token race and the queue that discards requests"
scores = { d = 4, b = 8, u = 7 }
markers = ["bug"]
acceptance_criteria = ["A concurrency test spawns overlapping consume/2 and refill/1 against one limiter and asserts the token count never exceeds the configured capacity and never regains tokens that were spent — demonstrated to fail against current main", "Token accounting in refill/1 uses an atomic ETS operation rather than lookup-then-insert", "A queued request is either actually delivered when tokens become available, or the queue is removed and consume/2 stops enqueueing — no code path spends tokens on a request it then discards", "A test asserts the chosen behaviour end to end: either the queued request reaches its destination, or no tokens are consumed on behalf of a request that is never sent", "mix precommit.full green"]
out_of_scope = ["Redesigning the public RateLimiter API", "Changing the default bucket size, refill rate, or cost function"]
files_to_modify = ["lib/zen_websocket/rate_limiter.ex", "test/zen_websocket/rate_limiter_test.exs"]
assignee = "codex"
model = "gpt-5.6-sol"
body = """
Two verified defects in lib/zen_websocket/rate_limiter.ex, both read from source on 2026-08-20.

1. NON-ATOMIC REFILL AGAINST A :public TABLE. The ETS table is created `[:named_table, :public, :set]` (:67) and `consume/2` mutates tokens with `:ets.update_counter` (:105, :117) from arbitrary caller processes. But `refill/1` (:136) does a read-modify-write — `:ets.lookup(name, :tokens)` then `min(current + refill_rate, capacity)` then `:ets.insert` — so any `consume/2` that lands between the lookup and the insert is silently overwritten and its spent tokens are resurrected. Under sustained concurrent load the bucket drifts upward and the limiter stops limiting, which on a venue with hard rate limits means bans rather than backpressure.

2. THE QUEUE IS A TOKEN SINK. When tokens are exhausted, `consume/2` restores the cost, calls `handle_rate_limit/5`, and the caller receives `{:error, :rate_limited}` — so the caller is expected to retry. The request is ALSO enqueued. Later, `process_queue_with_tokens/4` (:296) pops `{{:value, {_request, cost}}, new_queue}` — it binds the request to `_request`, charges `cost` via `update_counter`, emits the pressure event, and recurses. The request is never sent anywhere. So every rate-limited request burns its token cost a second time, stealing capacity from the caller's real retry, and the queue's only observable effect is `queue_size` in `status/1`. Decide deliberately: wire the queue to a delivery callback, or delete it and keep consume/2 a pure allow/deny gate. Either is acceptable; silently spending tokens on discarded requests is not.

RUNTIME-VERIFIED 2026-08-20 (Tidewave project_eval against the running dev BEAM). Both defects reproduce, and defect 1 is larger than the static reading suggested.

Defect 1 magnitude: `RateLimiter.init(name, %{tokens: 10_000_000, refill_rate: 10, refill_interval: 60_000, request_cost: &RateLimiter.simple_cost/1})`, park the bucket at 5_000_000, then run ONE serial refiller doing 400 sequential `refill/1` calls concurrently with 4000 `Task.async` `consume/2` calls — the serial refiller is deliberately the production shape, since `schedule_refill/2` sends to a single timer owner. Expected final tokens are `start + 400*10 - 4000`. Over 15 rounds the actual count exceeded expected every time but one, by 71, 6, 0, 197, 327, 204, 393, 471, 657, 14, 294, 15, 86, 297 and 411 tokens. That is up to 657 of 4000 consumed tokens — 16% — silently refunded in a single round, mean ~230. The drift is strictly positive, i.e. `consume/2` decrements are lost to `refill/1`'s stale-read insert, which is the under-limiting direction: the limiter hands out more capacity than configured, which is the ban case, not the backpressure case. (A separate control run with 400 CONCURRENT refillers showed the opposite sign — drift in exact multiples of `refill_rate`, i.e. refill-vs-refill increments lost. Both are the same missing atomicity; only the serial-refiller run reflects production.) Use this harness as the concurrency regression test; note that a small round count will pass by luck — two of fifteen rounds drifted by 0 and 6.

Defect 2 repro: `init` with `tokens: 2, refill_rate: 5, max_queue_size: 100`, drain the two tokens, then `consume(name, %{"id" => i})` for i in 1..3. All three return `{:error, :rate_limited}` and `status/1` reports `queue_size: 3, tokens: 0`. Call `refill/1` once: `status/1` then reports `queue_size: 1, tokens: 0` — two queued requests were dequeued and their tokens spent — while the test process's mailbox received nothing at all. There is no delivery channel of any kind: the requests are charged and dropped, and the callers who were told `:rate_limited` will pay again on retry.
"""
