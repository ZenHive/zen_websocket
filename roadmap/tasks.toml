schema_version = 2
project = "zen_websocket"
default_branch = "main"
vision = "Production-grade WebSocket client library for Elixir, designed for financial APIs (particularly Deribit). Trust working quality gates, fail gracefully on dead connections, and preserve caller configuration across reconnects."

[focus]
phase = 1

[phases.1]
name = "Post-v0.6.1 Backlog"
order = 1
status = "pending"

[bundles.code-quality]
phase = 1
order = 1
description = "Reach / ex_dna-driven quality and refactor cleanups seeded from mix reach (1.5) analysis on 2026-04-20"

[bundles.ci]
phase = 1
order = 2
description = "CI coverage measurement and gating"

[bundles.reconnect]
phase = 1
order = 3
description = "Reconnect state machine correctness — the retry_count/backoff path and the supervisor-side fallout of abnormal Client termination"

[bundles.correctness]
phase = 1
order = 4
description = "Defects on paths the mix precommit.full gate structurally cannot see: races, always-true guards, discarded requests, metrics pinned to a constant"

[bundles.hygiene]
phase = 1
order = 5
description = "Tests that cannot fail, documentation that describes a library that does not exist, and stated policies contradicted by shipped code"

