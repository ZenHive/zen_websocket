# Deterministic Elixir harness gate for PRs.
# Closes the Codex-env-blocked-hex.pm gap: every PR push gets format / compile /
# credo / doctor / sobelow / test+cover / dialyzer evidence as PR checks, instead
# of needing a local reviewer to fetch the branch and run the suite.
#
# Elixir/OTP are pinned inline (this repo has no `.tool-versions`). Adopting a
# `.tool-versions` and switching to `version-file` would make CI and local dev
# share one source and is the recommended follow-up.

name: Harness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Harness
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7

      - id: beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - name: Cache deps & _build (covers dialyxir PLT default path)
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            priv/plts
          key: mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get

      # Single deterministic gate: compile / format / credo / doctor / ex_dna /
      # reach.check (arch+smells) / sobelow --skip / deps.audit.gated /
      # test.json (coverage >=58%) / dialyzer (forced MIX_ENV=dev inside the
      # alias — see mix.exs `aliases/0` comment on the PLT OOM tuning) /
      # agents.check (AGENTS.md freshness). Kept as one `mix ci` invocation so
      # CI and the local/harness-reviewer gate cannot drift apart again.
      #
      # NOTE (2026-08-01): the coverage floor lives solely in mix.exs's
      # `precommit`/`precommit.full` aliases (see the rationale comment
      # there) — this workflow has no separate threshold of its own, it just
      # runs `mix ci`. History: an earlier, undocumented CI-only workaround
      # pinned this to ~50% (creds-less CI can't exercise `:integration`
      # tests, which read ~0% offline); a later pass tried raising it to a
      # blanket 80%, which turned out to have never actually been met by any
      # run of this alias — it went red unconditionally rather than gating
      # anything. The alias now pins the *measured* non-integration
      # coverage (58%, rounded down) as a ratchet floor. Raise it in lockstep
      # with real coverage growth; never restore a number that isn't
      # currently met.
      - name: mix ci
        run: mix ci
